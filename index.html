<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="robots" content="index,follow">
  <title>Chargement...</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" id="brandLink" href="#" aria-label="Accueil">
        <span class="brand-mark" id="brandMark">DS</span>
        <span>
          <strong id="brandName">Chargement...</strong>
          <small id="brandTagline"></small>
        </span>
      </a>

      <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="mainMenu">
        Menu
      </button>
      <nav id="mainMenu" class="main-menu" aria-label="Navigation principale"></nav>
    </div>
  </header>

  <main id="contenu">
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroTitle">Chargement du site...</h1>
          <p class="hero-text" id="heroText"></p>
          <div class="actions" id="heroActions"></div>
        </div>
        <aside class="status-card" aria-label="État du service">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <strong id="statusTitle">Connexion aux données</strong>
            <p id="statusText">Lecture de la configuration DSE.</p>
          </div>
        </aside>
      </div>
    </section>

    <section class="section" aria-labelledby="servicesTitle">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" id="servicesEyebrow"></p>
          <h2 id="servicesTitle"></h2>
          <p id="servicesText"></p>
        </div>
        <div id="serviceGrid" class="card-grid"></div>
      </div>
    </section>

    <section class="section section-soft" aria-labelledby="universTitle">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" id="universEyebrow"></p>
          <h2 id="universTitle"></h2>
          <p id="universText"></p>
        </div>
        <div id="universGrid" class="universe-grid"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="ctaTitle">
      <div class="container cta">
        <div>
          <p class="eyebrow" id="ctaEyebrow"></p>
          <h2 id="ctaTitle"></h2>
          <p id="ctaText"></p>
        </div>
        <div class="actions" id="ctaActions"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p id="footerText"></p>
      <nav id="footerMenu" aria-label="Liens de pied de page"></nav>
    </div>
  </footer>

  <div class="error-panel" id="errorPanel" hidden role="alert">
    <strong>Impossible de charger la configuration du site.</strong>
    <span id="errorText"></span>
  </div>
</body>
</html>
