<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Connexion au cockpit DemainSite Écosystème">
  <title>Connexion | Cockpit DSE</title>
  <link rel="stylesheet" href="assets/css/dse.css">
</head>

<body class="page-connexion">

  <main class="connexion-carte">

    <div class="marque">DS</div>

    <p class="surtitre">DemainSite Écosystème</p>

    <h1>Cockpit DSE</h1>

    <p class="texte-secondaire">
      Accès sécurisé à votre environnement.
    </p>

    <form id="form-connexion">

      <label for="identifiant">
        Identifiant du compte DSE
      </label>

      <input
        id="identifiant"
        name="identifiant"
        autocomplete="username"
        required
      >

      <label for="mot-de-passe">
        Mot de passe
      </label>

      <input
        id="mot-de-passe"
        name="motDePasse"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Se connecter
      </button>

      <p
        id="message-connexion"
        class="message"
        role="status"
        aria-live="polite">
      </p>

    </form>

    <div class="etat">
      <span id="voyant-api" class="voyant"></span>
      <span id="etat-api">Contrôle API DSE...</span>
    </div>

  </main>

  <script type="module" src="assets/js/connexion.js"></script>

</body>
</html>
