# A installer dans /etc/nginx/sites-available/dse (lien dans sites-enabled).
# HTTPS/HSTS : volontairement non configures ici (traite separement).
server {
    listen 80;

    server_name dseco.fr www.dseco.fr;

    location /api/v1/ {
        limit_req zone=dse_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Anciens en-tetes d'identite Azure : jamais acceptes depuis l'exterieur.
        proxy_set_header x-ms-client-principal "";
        proxy_set_header x-ms-client-principal-id "";
        proxy_set_header x-ms-client-principal-name "";
        proxy_set_header x-ms-client-principal-idp "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
